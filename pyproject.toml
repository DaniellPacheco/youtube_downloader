[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-downloader-local"
version = "0.1.0"
description = "Downloader e cortador local de videos do YouTube"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "yt-dlp>=2025.1.1",
  "pydantic>=2.9,<3",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-asyncio>=0.24,<1"]
ai = ["audio-separator[cpu]==0.47.1", "librosa>=0.10,<0.12"]
ai-gpu = ["audio-separator[gpu]==0.47.1", "librosa>=0.10,<0.12", "onnxruntime-gpu>=1.20,<1.24"]
ai-directml = ["audio-separator[dml]==0.47.1", "librosa>=0.10,<0.12"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

